[tool.poetry]
name = "translationvideo"
version = "0.1.0"
description = ""
authors = ["Bulat Nasyrov <bulatnasirov2003@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pysrt = "^1.1.2"
librosa = "^0.11.0"
googletrans = "^4.0.2"
openai-whisper = "^20250625"
lingua-language-detector = "^2.1.1"
whisper = "^1.1.10"

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "depcleaner (>=2.0.0,<3.0.0)"
]
test = [
    "pytest (>=9.2.0,<10.0.0)"
]
